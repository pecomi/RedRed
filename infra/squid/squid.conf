# Default-deny egress proxy. The only way out of the sandbox.
# Allowed: the LLM API over HTTPS (CONNECT :443) and our own staging target over HTTP :8000.
# Everything else is refused and logged as TCP_DENIED/403 (evidence for scripts/count_egress.py).
# Adding a host here widens the "0 reached outside the allowed hosts" claim; update count_egress.py too.

http_port 3128

acl llm_hosts dstdomain api.baze.co
acl target_host dstdomain staging-target
acl SSL_ports port 443
acl target_port port 8000
acl CONNECT method CONNECT

# HTTPS: CONNECT tunnels only to the LLM hosts on 443
http_access allow CONNECT llm_hosts SSL_ports
http_access deny CONNECT

# Plain HTTP: only the staging target on :8000
http_access allow target_host target_port
http_access deny all

# No caching, no identifying headers added to outgoing requests
cache deny all
via off
forwarded_for delete

access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
logfile_rotate 0
pid_filename /run/squid/squid.pid
shutdown_lifetime 1 seconds
